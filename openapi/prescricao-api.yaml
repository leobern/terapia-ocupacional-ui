openapi: 3.0.3
info:
  title: Prescrição nutricional API
  version: 1.0.0
  description: >
    Prescrição nutricional vigente do paciente (Hub). Espelha os modelos Prescription e
    PrescriptionSaveRequest da UI (patient-hub/prescription). Cada gravação é uma versão nova e
    imutável (trilha de auditoria) que substitui o conjunto de vias ativas; a leitura devolve a
    mais recente. Autor e data/hora são do servidor (usuário do token e relógio do servidor).
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/pacientes/{pacienteId}/prescricao:
    get:
      operationId: getPrescricaoPaciente
      x-implemented: true
      summary: Prescrição nutricional vigente do paciente
      description: >
        Devolve a última prescrição gravada, com uma entrada por via ativa. Paciente sem
        prescrição responde 204 sem corpo. Exige vínculo aprovado do profissional com o hospital
        do paciente; paciente inexistente e paciente de outro hospital respondem o mesmo 404.
      parameters:
        - name: pacienteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Prescrição vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescricao"
        "204":
          description: Paciente sem prescrição
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: Paciente inexistente ou de hospital sem vínculo aprovado do profissional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: savePrescricaoPaciente
      x-implemented: true
      summary: Grava uma nova versão da prescrição nutricional
      description: >
        Substitui a prescrição vigente inteira por uma nova versão imutável, com de 1 a 3 vias
        (VO, NE, NP), sem via repetida. A fórmula é referenciada por formulaId do catálogo (somente
        leitura, padronizada no hospital do paciente); nome e densidades vêm do catálogo e são gravados como snapshot, e a fórmula
        precisa ter kcal e proteína por ml cadastrados. Modalidades intermittent e cyclic exigem ao
        menos um horário de pausa, único e depois do início; na continuous as pausas são
        descartadas. Mesma regra de acesso do GET.
      parameters:
        - name: pacienteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalvarPrescricaoRequest"
      responses:
        "200":
          description: Versão gravada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescricao"
        "400":
          description: >
            Campo inválido, via repetida, fórmula inexistente ou sem densidade, ou horários
            incoerentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          description: Paciente inexistente ou de hospital sem vínculo aprovado do profissional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [message, timestamp]
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    PrescricaoItemRequest:
      type: object
      required: [route, formulaId, volumeMl, modality, startTime]
      properties:
        route:
          type: string
          enum: [VO, NE, NP]
        formulaId:
          type: integer
          format: int64
          description: Id da fórmula no catálogo
        volumeMl:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 20000
        modality:
          type: string
          enum: [continuous, intermittent, cyclic]
        startTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Horário HH:MM
        pauseTimes:
          type: array
          maxItems: 24
          items:
            type: string
            pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        nursingNotes:
          type: string
          nullable: true
          maxLength: 1000
    SalvarPrescricaoRequest:
      type: object
      required: [prescriptions]
      properties:
        prescriptions:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/PrescricaoItemRequest"
    PrescricaoItem:
      type: object
      required:
        - route
        - formulaId
        - formulaName
        - kcalPerMl
        - proteinPerMl
        - volumeMl
        - modality
        - startTime
        - pauseTimes
        - nursingNotes
        - at
        - author
      properties:
        route:
          type: string
          enum: [VO, NE, NP]
        formulaId:
          type: integer
          format: int64
        formulaName:
          type: string
        kcalPerMl:
          type: number
        proteinPerMl:
          type: number
        volumeMl:
          type: number
        modality:
          type: string
          enum: [continuous, intermittent, cyclic]
        startTime:
          type: string
        pauseTimes:
          type: array
          items:
            type: string
        nursingNotes:
          type: string
        at:
          type: string
          format: date-time
        author:
          type: string
          description: Nome completo do profissional que gravou
    Prescricao:
      type: object
      required: [prescriptions]
      properties:
        prescriptions:
          type: array
          items:
            $ref: "#/components/schemas/PrescricaoItem"
