openapi: 3.0.3
info:
  title: Internações API
  version: 1.0.0
  description: >
    Contrato da US-002-1-06 (FT-002-1 Cadastro de Paciente): criação da internação
    (registro variável, 1:N em relação ao Paciente) com os dados coletados pelo chatbot,
    um por vez. A coleta conversacional pertence à camada de IA/chatbot (fora de escopo);
    esta API recebe os campos já coletados. Todos os campos são opcionais (RN-01): o
    usuário pode pular qualquer pergunta e a internação é criada com campos vazios.
    Edição da internação e movimentação de leito estão fora de escopo.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/pacientes/{pacienteId}/internacoes:
    post:
      operationId: createInternacao
      x-implemented: true
      summary: Cria a internação vinculada ao paciente com os dados informados (todos opcionais)
      description: >
        Requer que o profissional tenha vínculo aprovado com o hospital do paciente.
        RN-01: corpo pode ser vazio ({}); campos ausentes ou nulos ficam vazios.
        RN-02: hospitalAdmissionDate, quando informada, não pode ser futura em relação à
        data do sistema; caso contrário 422 com field=hospitalAdmissionDate, code=MSG-08 e
        message "A data de internação hospitalar não pode ser uma data futura." (o chatbot
        pergunta a data novamente e nada é salvo). Datas malformadas ou textos acima dos
        limites resultam em 400.
      parameters:
        - name: pacienteId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInternacaoRequest"
      responses:
        "201":
          description: Internação criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Internacao"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          description: Profissional sem vínculo aprovado com o hospital do paciente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Paciente não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: MSG-08 (hospitalAdmissionDate futura)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [message, timestamp]
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    ValidationErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"
        - type: object
          required: [field, code]
          properties:
            field:
              type: string
              enum: [hospitalAdmissionDate]
            code:
              type: string
              enum: [MSG-08]
    CreateInternacaoRequest:
      type: object
      properties:
        bedNumber:
          type: string
          nullable: true
          maxLength: 20
        healthInsurance:
          type: string
          nullable: true
          maxLength: 100
        admissionNumber:
          type: string
          nullable: true
          maxLength: 30
          description: Sem formato fixo
        hospitalAdmissionDate:
          type: string
          format: date
          nullable: true
          description: Data válida, não futura (MSG-08)
        nutritionalTherapyStartDate:
          type: string
          format: date
          nullable: true
          description: Data válida
    Internacao:
      type: object
      required: [id, pacienteId, createdAt]
      properties:
        id:
          type: integer
          format: int64
        pacienteId:
          type: integer
          format: int64
        bedNumber:
          type: string
          nullable: true
        healthInsurance:
          type: string
          nullable: true
        admissionNumber:
          type: string
          nullable: true
        hospitalAdmissionDate:
          type: string
          format: date
          nullable: true
        nutritionalTherapyStartDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
