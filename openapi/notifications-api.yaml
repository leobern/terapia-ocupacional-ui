openapi: 3.0.3
info:
  title: Notifications API
  version: 1.0.0
  description: >
    Contrato da tela Notificações (specs/004-notificacoes). Consumido pelo frontend via
    openapi-generator-cli (typescript-angular) — ver
    terapia-ocupacional-ui/openapitools.json. Servido pelo módulo
    pt.terapiaocupacional.home (backend) — Notificacao já é dono deste módulo desde a
    Home (research.md §1), esta feature estende com respostas e listagem por status.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/notifications:
    get:
      operationId: getNotifications
      x-implemented: false
      summary: >
        Lista paginada de notificações do profissional autenticado, filtrada por status
        (pendente/resolvida — FR-004a). Cada seção da tela pagina de forma independente.
      parameters:
        - name: hospitalId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/NotificationStatus"
        - name: cursor
          in: query
          required: false
          description: Cursor opaco do último item carregado nesta seção (ausente = primeiro lote)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 10
      responses:
        "200":
          description: >
            Lote de até 10 notificações daquele status, ordenadas da mais recente para a
            mais antiga (FR-004a).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          description: Não autenticado
        "403":
          description: Profissional sem vínculo com o hospital informado

  /api/v1/notifications/{notificationId}/replies:
    post:
      operationId: createNotificationReply
      x-implemented: false
      summary: >
        Registra a resposta do profissional autenticado a uma notificação (FR-009); move a
        notificação da seção Pendentes para Resolvidas.
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReplyRequest"
      responses:
        "201":
          description: Resposta registrada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationReply"
        "401":
          description: Não autenticado
        "403":
          description: >
            Profissional sem vínculo com o hospital da notificação, ou notificação não
            direcionada a este profissional (destinatarioId ≠ subject do JWT)
        "404":
          description: Notificação não encontrada
        "422":
          description: "Corpo inválido (ex.: texto vazio)"

  /api/v1/notifications/{notificationId}/resolve:
    post:
      operationId: resolveNotification
      x-implemented: true
      summary: Marca a thread/pendência como resolvida (registro compartilhado com o Hub do paciente)
      description: >
        Permitido a qualquer participante da thread: remetente original, destinatário
        mencionado (pessoa, ou membro de grupo resolvido) ou quem já respondeu. Não exige
        abrir a conversa nem corpo de requisição. O status é um único registro
        compartilhado — o mesmo valor aparece na lista de notificações e no card do Hub do
        paciente. Persiste autor e data/hora da ação em trilha de auditoria imutável
        (FR-014). Idempotente: se a thread já está resolvida, retorna 200 com o estado
        atual, sem nova entrada de auditoria. Uma nova resposta reabre a thread
        (comportamento da US-005-1-02, fora desta operação).
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Thread resolvida; retorna o registro atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Profissional sem vínculo com o hospital/paciente, ou não é participante da thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Notificação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [message, timestamp]
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        detalhes:
          type: array
          nullable: true
          items:
            type: string

    NotificationStatus:
      type: string
      enum: [pending, resolved]
      description: >
        pending = thread ativa; resolved = thread marcada como resolvida por um participante
        (POST .../resolve) e não reaberta por resposta posterior. Revisão da US-005-1-03:
        o status passa a ser o registro compartilhado de resolução (resolvedAt), não mais
        derivado apenas da existência de respostas.

    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
          nullable: true
          description: null quando não há mais notificações daquele status a carregar

    Notification:
      type: object
      required: [id, author, description, createdAt, read, replyCount]
      description: >
        REVISÃO US-005-1-03: `patient` deixou de ser required porque o backend ainda não tem
        entidade/vínculo de paciente em `notificacao` (nem as respostas — `replyCount` é 0 e
        `replies` é omitido até a US-005-1-02); a UI deve tratar `patient` ausente.
        Texto original: `patient` era required nesta v1 porque o único `tipoEvento` suportado hoje é
        relacionado a paciente (spec.md FR-006) — mas a coluna correspondente no banco
        (`notificacao.paciente_id`) já é nullable, de propósito, para permitir tipos de
        notificação futuros sem paciente associado (research.md §4, spec.md § Assumptions).
        Quando um `tipoEvento` desse tipo for implementado, este schema MUST ser revisado
        para tornar `patient` opcional — não usar um valor fictício/placeholder para
        contornar esta obrigatoriedade.
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: "#/components/schemas/ProfessionalRef"
        patient:
          $ref: "#/components/schemas/PatientRef"
        description:
          type: string
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
        mentioned:
          type: array
          description: Destinatários mencionados (pessoas); usado pela UI para decidir se o profissional é participante
          items:
            $ref: "#/components/schemas/ProfessionalRef"
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          description: Data/hora em que a thread foi resolvida; null quando ativa
        resolvedBy:
          allOf:
            - $ref: "#/components/schemas/ProfessionalRef"
          nullable: true
          description: Autor da resolução; null quando ativa
        replyCount:
          type: integer
          description: >
            Contagem de respostas já registradas (FR-012, tag "N Respostas"); 0 = notificação
            pendente.
        replies:
          type: array
          description: >
            Histórico completo de respostas, sempre incluído quando `replyCount > 0`
            (volume tipicamente pequeno por notificação — sem necessidade de um endpoint
            de detalhe separado). O frontend só renderiza esta lista quando o card é
            expandido (`Answer-open` — FR-012); o payload já vem completo desde a
            listagem paginada, simplificando o estado do NgRx (sem fetch adicional ao
            expandir).
          items:
            $ref: "#/components/schemas/NotificationReply"

    NotificationReply:
      type: object
      required: [id, author, text, createdAt]
      properties:
        id:
          type: integer
          format: int64
        author:
          $ref: "#/components/schemas/ProfessionalRef"
        text:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReplyRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1

    ProfessionalRef:
      type: object
      required: [id, name, specialty]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        specialty:
          type: string
        photoUrl:
          type: string
          nullable: true
          description: Ausente/nulo → frontend renderiza avatar de iniciais

    PatientRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: >
            Exibido no bloco "Paciente" do card (FR-005); usado para navegar à tela de
            detalhe do paciente ao tocar no card (FR-006) — rota de destino ainda não
            implementada nesta versão do app (research.md §8).
