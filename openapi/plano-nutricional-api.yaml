openapi: 3.0.3
info:
  title: Plano nutricional API
  version: 1.0.0
  description: >
    Plano nutricional do paciente no Hub: via de nutrição, decisão de deglutição, peso de referência,
    metas calórica e proteica, cadência de revisão e responsável, mais as sinalizações de mudança de conduta.
    Cada gravação do plano é uma versão nova e imutável (trilha de auditoria) que carrega o estado completo;
    a leitura devolve a mais recente. Autor e data/hora vêm do servidor (token e relógio). Espelha o
    PlanoSource da UI. O risco de realimentação é cálculo de motor externo e não faz parte deste contrato.
servers:
  - url: /
security:
  - bearerAuth: []
paths:
  /api/v1/pacientes/{pacienteId}/plano-nutricional:
    get:
      operationId: getPlanoNutricional
      x-implemented: true
      summary: Plano nutricional vigente do paciente
      description: >
        Devolve a versão mais recente. 204 quando o paciente ainda não tem plano (estado vazio, não erro).
        Acesso exige vínculo APROVADO com o hospital do paciente; inexistente e de outro hospital respondem
        ambos 404.
      parameters:
        - $ref: "#/components/parameters/PacienteId"
      responses:
        "200":
          description: Plano vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanoNutricional"
        "204":
          description: Paciente ainda sem plano
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/PacienteNaoEncontrado"
    put:
      operationId: savePlanoNutricional
      x-implemented: true
      summary: Grava uma nova versão do plano nutricional
      description: >
        Todos os campos são opcionais, mas ao menos um é obrigatório (400 caso contrário). O que vier
        ausente mantém o valor vigente na nova versão. Em routes, duplicatas são removidas e a ordem é
        VO, NE, NP; routesSince só muda quando a combinação de vias muda. Em cadence, 0 é domingo e 6 é
        sábado. Em targets, a calorimetria é obrigatória na fórmula INDIRECT_CALORIMETRY e proibida na
        SIMPLIFIED. As metas e o peso de referência são gravados como calculados pelo cliente.
      parameters:
        - $ref: "#/components/parameters/PacienteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalvarPlanoNutricionalRequest"
      responses:
        "200":
          description: Versão gravada (estado completo do plano)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanoNutricional"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/PacienteNaoEncontrado"
  /api/v1/pacientes/{pacienteId}/plano-nutricional/sinalizacoes:
    get:
      operationId: listSinalizacoesConduta
      x-implemented: true
      summary: Sinalizações de mudança de conduta do paciente
      description: >
        Da mais antiga para a mais recente; lista vazia quando não há. As sinalizações só alertam: não
        expiram e não alteram o plano. Mesma regra de acesso de getPlanoNutricional.
      parameters:
        - $ref: "#/components/parameters/PacienteId"
      responses:
        "200":
          description: Sinalizações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SinalizacaoConduta"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/PacienteNaoEncontrado"
    post:
      operationId: addSinalizacaoConduta
      x-implemented: true
      summary: Acrescenta uma sinalização de mudança de conduta
      description: >
        Só acréscimo (trilha de auditoria imutável). Autor e data/hora vêm do servidor.
      parameters:
        - $ref: "#/components/parameters/PacienteId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalvarSinalizacaoRequest"
      responses:
        "201":
          description: Sinalização gravada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SinalizacaoConduta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/PacienteNaoEncontrado"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PacienteId:
      name: pacienteId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: Erro
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PacienteNaoEncontrado:
      description: Paciente inexistente ou de hospital sem vínculo aprovado do profissional
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [message, timestamp]
      properties:
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    ViaNutricao:
      type: string
      enum: [VO, NE, NP]
    DecisaoDegluticao:
      type: string
      enum: [NEEDED, NOT_NEEDED]
    TipoPesoReferencia:
      type: string
      enum: [IDEAL, ADJUSTED, DRY, CURRENT]
    FormulaMeta:
      type: string
      enum: [SIMPLIFIED, INDIRECT_CALORIMETRY]
    PesoReferencia:
      type: object
      required: [kg, kind]
      properties:
        kg:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 500
        kind:
          $ref: "#/components/schemas/TipoPesoReferencia"
    Calorimetria:
      type: object
      required: [kcal, percent]
      properties:
        kcal:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 20000
        percent:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 150
    Metas:
      type: object
      required: [formula, kcalPerDay, kcalPerKg, proteinPerDay, proteinPerKg, referenceWeight]
      properties:
        formula:
          $ref: "#/components/schemas/FormulaMeta"
        kcalPerDay:
          type: integer
          minimum: 1
          maximum: 20000
        kcalPerKg:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 200
        proteinPerDay:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000
        proteinPerKg:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 20
        calorimetry:
          allOf:
            - $ref: "#/components/schemas/Calorimetria"
          nullable: true
          description: Presente só quando a fórmula é INDIRECT_CALORIMETRY
        referenceWeight:
          $ref: "#/components/schemas/PesoReferencia"
    PlanoNutricional:
      type: object
      required: [author, at]
      properties:
        routes:
          type: array
          nullable: true
          description: Vias em uso simultâneo, na ordem VO, NE, NP; nulo quando ainda não definidas
          items:
            $ref: "#/components/schemas/ViaNutricao"
        routesSince:
          type: string
          format: date-time
          nullable: true
          description: Desde quando a combinação de vias vigente vale
        swallowing:
          allOf:
            - $ref: "#/components/schemas/DecisaoDegluticao"
          nullable: true
        referenceWeight:
          allOf:
            - $ref: "#/components/schemas/PesoReferencia"
          nullable: true
        targets:
          allOf:
            - $ref: "#/components/schemas/Metas"
          nullable: true
        cadence:
          type: array
          nullable: true
          description: Dias da semana da revisão (0 domingo a 6 sábado), ordenados; nulo vale a diária
          items:
            type: integer
            minimum: 0
            maximum: 6
        responsible:
          type: string
          nullable: true
          description: Nome do responsável pelo plano
        author:
          type: string
          description: Nome do profissional que gravou esta versão
        at:
          type: string
          format: date-time
    SalvarPlanoNutricionalRequest:
      type: object
      description: Todos os campos opcionais, ao menos um obrigatório; ausente mantém o valor vigente
      properties:
        routes:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: "#/components/schemas/ViaNutricao"
        swallowing:
          $ref: "#/components/schemas/DecisaoDegluticao"
        referenceWeight:
          $ref: "#/components/schemas/PesoReferencia"
        targets:
          $ref: "#/components/schemas/Metas"
        cadence:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: integer
            minimum: 0
            maximum: 6
        responsible:
          type: string
          minLength: 1
          maxLength: 150
    SinalizacaoConduta:
      type: object
      required: [id, text, author, at]
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
        author:
          type: string
        at:
          type: string
          format: date-time
    SalvarSinalizacaoRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
