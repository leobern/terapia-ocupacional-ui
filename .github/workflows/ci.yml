name: CI

# Constituição Conductia, Workflow de Desenvolvimento: "CI obrigatório em todo PR
# [...] NENHUM merge com pipeline vermelho". O repositório não tinha nenhum workflow
# até aqui — foi por isso que o PR #1 chegou a review com o build quebrado
# (import para `src/app/features/`, diretório que não existia).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts`: o `postinstall` do projeto gera os models OpenAPI
      # (precisa de Java) e baixa os browsers do Playwright. Nada disso entra em
      # `src/` — os models são emitidos em `dist/openapi/` — então lint, teste e
      # build não dependem deles. O job de E2E, quando existir, roda o postinstall
      # completo.
      #
      # `--frozen-lockfile` é o ponto: mudança de dependência sem lockfile
      # atualizado no mesmo commit falha aqui (Princípio XI).
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm run lint

      # Os testes rodam no chrome-headless-shell do Playwright, o mesmo que o
      # karma.conf.js usa nas máquinas locais. No Google Chrome completo do runner,
      # a janela às vezes perdia o foco no meio da suíte e os testes de foco
      # falhavam sem que nada no código tivesse mudado.
      - name: Install test browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # O runner já define CHROME_BIN apontando para o Google Chrome; por isso é
      # sobrescrito aqui. Sem o headless shell, o passo falha em vez de voltar ao
      # Chrome em silêncio.
      - name: Test
        run: |
          CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -n 1)"
          test -x "$CHROME_BIN"
          export CHROME_BIN
          pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI

      - name: Build
        run: pnpm run build:ci
