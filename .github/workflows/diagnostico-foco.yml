# TEMPORÁRIO: repete a suíte com a correção. Sai antes da revisão.
name: diagnostico-foco

on:
  pull_request:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Rodadas
        run: |
          set +e
          export CHROME_BIN="$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -n 1)"
          falhas=0
          cat > src/app/zz-sonda.spec.ts <<'SPEC'
          jasmine.getEnv().addReporter({
            specDone: (r) => {
              if (Object.getOwnPropertyDescriptor(document, 'visibilityState')) {
                console.log(`VAZOU visibilidade depois de: ${r.fullName}`);
              }
            },
          });
          SPEC
          for n in $(seq 1 30); do
            pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI > saida.log 2>&1
            codigo=$?
            [ $codigo -ne 0 ] && falhas=$((falhas+1))
            echo "== shell $n codigo=$codigo $(grep -aoE 'TOTAL:.*' saida.log | tail -1)"
            grep -a ' FAILED' saida.log | grep -av Executed | head -8
            echo "== vazamentos na rodada $n: $(grep -ac 'VAZOU' saida.log)"
          done
          # Mesma sabotagem que reproduziu a falha no Google Chrome: abrir outra aba no meio.
          sed -i "s/flags: \['--no-sandbox'\],/flags: ['--no-sandbox', '--remote-debugging-port=9222'],/" karma.conf.js
          ( for i in $(seq 1 600); do
              curl -s http://localhost:9222/json/list | grep -q 'localhost:9876' && curl -s -X PUT 'http://localhost:9222/json/new?about:blank' >/dev/null && echo 'FOCO ROUBADO' && break
              sleep 0.1
            done ) &
          pnpm exec ng test --watch=false --browsers=ChromeHeadlessCI > saida.log 2>&1
          codigo=$?
          wait
          [ $codigo -ne 0 ] && falhas=$((falhas+1))
          echo "== shell foco-roubado codigo=$codigo $(grep -aoE 'TOTAL:.*' saida.log | tail -1)"
          echo "== rodadas com falha: $falhas"
          exit $falhas
