# TEMPORÁRIO: reproduz a falha dos testes de foco. Sai antes da revisão.
name: diagnostico-foco

on:
  pull_request:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Sonda de foco
        run: |
          cat > src/app/zz-sonda.spec.ts <<'SPEC'
          let anterior = '';
          let ultimo = 'inicio';
          const estado = (): string =>
            `iframe=${document.hasFocus()} topo=${window.parent.document.hasFocus()} visivel=${document.visibilityState}`;
          const olhar = (quando: string): void => {
            const agora = estado();
            if (agora !== anterior) {
              console.log(`SONDA ${agora} | ${quando} | spec anterior: ${ultimo}`);
              anterior = agora;
            }
          };
          jasmine.getEnv().addReporter({
            specStarted: (r) => olhar(`antes de: ${r.fullName}`),
            specDone: (r) => {
              olhar(`depois de: ${r.fullName}`);
              ultimo = r.fullName;
            },
          });
          window.addEventListener('blur', () => console.log(`SONDA evento blur durante/apos: ${ultimo}`));
          window.addEventListener('focus', () => console.log(`SONDA evento focus durante/apos: ${ultimo}`));
          SPEC
      - name: Rodadas
        run: |
          SHELL_BIN=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell | head -1)
          echo "shell=$SHELL_BIN google=$(google-chrome --version) CHROME_BIN_do_runner=$CHROME_BIN"
          set +e
          for n in $(seq 1 14); do
            CHROME_BIN=/usr/bin/google-chrome pnpm exec ng test --watch=false --browsers=ChromeHeadless > saida.log 2>&1
            echo "== google $n codigo=$? $(grep -aoE 'TOTAL:.*' saida.log | tail -1)"
            grep -a 'SONDA' saida.log | head -14
            grep -a ' FAILED' saida.log | grep -av Executed | sed 's/.*(Linux[^)]*) //' | sort -u | head -8
          done
