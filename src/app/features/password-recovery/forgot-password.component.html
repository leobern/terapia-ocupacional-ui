<!-- Figma "Conductia - V1", seção 12, telas 07 (pedir e-mail) e 08 (e-mail enviado). -->
@if (state() === 'SENT') {
  <app-auth-shell
    [title]="i18n.t('passwordRecovery.forgot.sentTitle')"
    [text]="i18n.t('passwordRecovery.forgot.sentMessage')"
    [statusText]="true"
  >
    <div class="auth-actions">
      <app-button
        kind="primary"
        appearance="outlined"
        [fullWidth]="!isDesktop()"
        [label]="i18n.t('passwordRecovery.forgot.resend')"
        (click)="resend()"
      />
      <app-button
        [fullWidth]="!isDesktop()"
        [label]="i18n.t('passwordRecovery.backToLogin')"
        (click)="goToLogin()"
      />
    </div>
  </app-auth-shell>
} @else {
  <app-auth-shell
    [title]="i18n.t('passwordRecovery.forgot.title')"
    [text]="i18n.t('passwordRecovery.forgot.description')"
  >
    <form class="auth-form" novalidate (submit)="submit($event)">
      <div class="auth-fields">
        <div class="auth-field">
          <label class="auth-field__label" for="forgot-email">{{
            i18n.t('passwordRecovery.forgot.emailLabel')
          }}</label>
          <input
            id="forgot-email"
            inputmode="email"
            autocapitalize="none"
            spellcheck="false"
            class="auth-field__input"
            type="email"
            name="email"
            autocomplete="email"
            [value]="email()"
            [attr.aria-invalid]="validationError() ? 'true' : null"
            [attr.aria-describedby]="
              validationError() ? 'forgot-email-error' : null
            "
            (input)="onInput($event)"
            (blur)="validateEmail()"
          />
          @if (validationError(); as error) {
            <p id="forgot-email-error" class="auth-field__error" role="alert">
              {{ error }}
            </p>
          }
        </div>
        @if (serviceError()) {
          <app-banner type="warning">{{
            i18n.t('passwordRecovery.forgot.serviceError')
          }}</app-banner>
        }
      </div>
      <div class="auth-actions">
        <app-button
          kind="primary"
          appearance="outlined"
          [fullWidth]="!isDesktop()"
          [label]="i18n.t('passwordRecovery.backToLogin')"
          (click)="goToLogin()"
        />
        <app-button
          htmlType="submit"
          [fullWidth]="!isDesktop()"
          [disabled]="state() === 'SENDING'"
          [label]="
            i18n.t(
              serviceError()
                ? 'passwordRecovery.forgot.retry'
                : 'passwordRecovery.forgot.submit'
            )
          "
        />
      </div>
    </form>
  </app-auth-shell>
}
