<app-page-container>
  <div class="settings">
    <h1 class="settings__title">{{ i18n.t('settings.title') }}</h1>
    <ul class="settings__list">
      <li>
        <button type="button" class="settings__item" (click)="reviewTutorial()">
          <ph-icon name="graduation-cap" [size]="24" />
          <span class="settings__label">{{
            i18n.t('settings.reviewTutorial')
          }}</span>
          <ph-icon name="caret-right" [size]="24" />
        </button>
      </li>
      <li>
        <button
          type="button"
          class="settings__item"
          (click)="openHospitalLinks()"
        >
          <ph-icon name="buildings" [size]="24" />
          <span class="settings__label">Vínculos com hospitais</span>
          <ph-icon name="caret-right" [size]="24" />
        </button>
      </li>
    </ul>
  </div>
</app-page-container>
