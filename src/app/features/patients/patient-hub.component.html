<app-page-container>
  <div class="patient-hub">
    <!-- Figma v2/PageHeader (Subtitle): voltar + título "Paciente" + hospital e data. -->
    <header class="patient-hub__header">
      <app-icon-button
        kind="primary"
        appearance="icon"
        icon="arrow-left"
        ariaLabel="Voltar"
        (click)="goBack()"
      />
      <div class="patient-hub__heading">
        <h1 class="patient-hub__title">Paciente</h1>
        <p class="patient-hub__subtitle">
          @if (hospitalName()) {
            {{ hospitalName() }} ·
          }
          {{ todayLabel }}
        </p>
      </div>
      <app-icon-button
        kind="primary"
        appearance="icon"
        icon="arrow-clockwise"
        ariaLabel="Atualizar"
        (click)="reload()"
      />
    </header>

    <!-- Resultados de outras features; sem resultado, o card fica em "Sem dados". -->
    <app-nutrition-panel [values]="values()" />
  </div>
</app-page-container>
