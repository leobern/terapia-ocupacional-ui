<!-- Variação "+" (desenhada pelo agente): o clique no próprio <dialog> é o clique no scrim; Esc fecha. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialogEl
  class="add-sheet"
  aria-labelledby="add-sheet-title"
  (click)="onDialogClick($event)"
  (cancel)="onCancel($event)"
>
  <span class="add-sheet__handle" aria-hidden="true"></span>
  <div class="add-sheet__header">
    <app-icon-logo class="sheet-logo" state="default" />
    <h2 id="add-sheet-title" class="add-sheet__title">Adicionar card</h2>
    <app-icon-button
      kind="secondary"
      appearance="icon"
      icon="x"
      ariaLabel="Fechar"
      (click)="closed.emit()"
    />
  </div>

  @if (available().length === 0) {
    <p class="add-sheet__empty" role="status">{{ emptyText }}</p>
  } @else {
    <ul class="add-sheet__list">
      @for (item of available(); track item.id) {
        <li>
          <button
            type="button"
            class="add-sheet__option"
            [disabled]="offline()"
            (click)="picked.emit(item.id)"
          >
            <span class="add-sheet__option-label">{{ item.label }}</span>
            <span class="add-sheet__option-unit">{{ item.unit }}</span>
          </button>
        </li>
      }
    </ul>
  }
  @if (offline()) {
    <p class="add-sheet__error" role="status">{{ offlineText }}</p>
  }
  @if (error(); as message) {
    <p class="add-sheet__error" role="alert">{{ message }}</p>
  }
</dialog>
