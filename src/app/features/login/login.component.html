<main class="login">
  <h1 class="login__title">{{ i18n.t('login.title') }}</h1>
  <form
    class="login__form"
    novalidate
    (submit)="$event.preventDefault(); submit()"
  >
    <label class="login__label">
      {{ i18n.t('login.email') }}
      <input
        class="login__field"
        type="email"
        name="email"
        autocomplete="username"
        [value]="email()"
        [attr.aria-invalid]="error() === 'validation' ? 'true' : null"
        (input)="onInput('email', $event)"
        (keydown.enter)="submit()"
      />
    </label>
    <label class="login__label">
      {{ i18n.t('login.password') }}
      <input
        class="login__field"
        type="password"
        name="password"
        autocomplete="current-password"
        [value]="password()"
        [attr.aria-invalid]="error() === 'validation' ? 'true' : null"
        (input)="onInput('password', $event)"
        (keydown.enter)="submit()"
      />
    </label>
    <p class="login__error" role="alert">{{ errorMessage() }}</p>
    <app-button
      [fullWidth]="true"
      [disabled]="loading() || locked()"
      [label]="loading() ? i18n.t('login.submitting') : i18n.t('login.submit')"
      [attr.aria-busy]="loading()"
      (click)="submit()"
    />
    <a class="login__link" routerLink="/forgot-password">{{
      i18n.t('login.forgotPassword')
    }}</a>
  </form>
</main>
