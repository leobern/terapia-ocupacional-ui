<!-- Figma "Conductia - V1", seção 12, tela 15 (bloqueio por inatividade): cadeado sobre o logo, só o ícone no cabeçalho. -->
<app-auth-shell
  logoIcon="lock-key"
  [title]="i18n.t('lock.title')"
  [text]="
    i18n.t(mode() === 'password' ? 'lock.passwordMessage' : 'lock.message')
  "
>
  @if (mode() === 'biometric') {
    <div class="auth-form">
      @if (biometricFailed()) {
        <p class="auth-field__error" role="alert">
          {{ i18n.t('lock.biometricFailed') }}
        </p>
      }
      <div class="auth-actions">
        <button
          type="button"
          class="auth-link auth-link--button"
          (click)="signOut()"
        >
          {{ i18n.t('lock.signOut') }}
        </button>
        <app-button
          [fullWidth]="!isDesktop()"
          [disabled]="busy()"
          [label]="i18n.t('lock.useBiometric')"
          (click)="tryBiometric()"
        />
      </div>
    </div>
  } @else if (mode() === 'password') {
    <form class="auth-form" novalidate (submit)="submitPassword($event)">
      <div class="auth-fields">
        <div class="auth-field">
          <label class="auth-field__label" for="lock-password">{{
            i18n.t('lock.passwordLabel')
          }}</label>
          <app-password-field
            inputId="lock-password"
            [invalid]="passwordIssue() === 'invalid'"
            [describedBy]="passwordIssue() ? 'lock-password-error' : null"
            [value]="password()"
            (valueChange)="onPassword($event)"
          />
          @if (passwordIssue(); as issue) {
            <p id="lock-password-error" class="auth-field__error" role="alert">
              {{ i18n.t(passwordMessageKey[issue]) }}
            </p>
          }
        </div>
      </div>
      <div class="auth-actions">
        <button
          type="button"
          class="auth-link auth-link--button"
          (click)="signOut()"
        >
          {{ i18n.t('lock.signOut') }}
        </button>
        <app-button
          htmlType="submit"
          [fullWidth]="!isDesktop()"
          [disabled]="busy()"
          [label]="i18n.t('lock.unlock')"
        />
      </div>
    </form>
  }
</app-auth-shell>
