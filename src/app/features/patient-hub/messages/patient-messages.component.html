@if (records().length > 0 || loadFailed()) {
  <section class="records" aria-labelledby="records-title">
    <h2 id="records-title" class="records__title">Observações</h2>
    @if (loadFailed()) {
      <p class="records__status" role="alert">{{ loadFailedHint }}</p>
    }
    @for (record of records(); track record.id) {
      <article class="records__card" data-testid="record-card">
        <header class="records__meta">
          <span class="records__tag">Observação</span>
          <span class="records__author"
            >{{ record.author }} · {{ time(record.at) }}</span
          >
        </header>
        <p class="records__content">{{ record.content }}</p>
      </article>
    }
  </section>
}
