<!-- Figma 4718-10198, campo "Via de nutrição" da seção "Meta e via" (desenhado pelo agente). -->
<div class="route" data-testid="route-change">
  <p class="route__label">Via de nutrição</p>
  <p class="route__value" data-testid="route-current">{{ currentLabel() }}</p>

  @if (isDoctor && editing()) {
    <fieldset class="route__options">
      <legend class="route__legend">
        Nova via (pode combinar mais de uma)
      </legend>
      @for (option of options; track option.id) {
        <label class="route__option">
          <input
            type="checkbox"
            class="route__checkbox"
            [checked]="isSelected(option.id)"
            [attr.data-route]="option.id"
            (change)="toggle(option.id)"
          />
          <span
            ><strong>{{ option.id }}</strong> · {{ option.label }}</span
          >
        </label>
      }
    </fieldset>
    <div class="route__actions">
      <app-button
        label="Cancelar"
        kind="secondary"
        [fullWidth]="true"
        [disabled]="saving()"
        (click)="cancel()"
      />
      <app-button
        label="Salvar via"
        [fullWidth]="true"
        [disabled]="saving() || !online()"
        (click)="save()"
      />
    </div>
  } @else if (isDoctor) {
    <app-button
      label="Alterar via"
      kind="secondary"
      [fullWidth]="true"
      [disabled]="!online()"
      (click)="startEditing()"
    />
  }
  <p class="route__help">{{ confirmHint }}</p>
  @if (!online()) {
    <p class="route__help" role="status" data-testid="route-offline">
      {{ offlineHint }}
    </p>
  }
  @if (hint(); as message) {
    <p class="route__error" role="alert" data-testid="route-hint">
      {{ message }}
    </p>
  }
</div>
