<main class="home">
  <h1 class="home__title">Conductia</h1>
  <app-home-header />
  <section class="home__content" [attr.data-state]="loadState()">
    @switch (loadState()) {
      @case ('loading') {}
      @case ('error') {}
      @default {
        <p class="home__message">
          Tela inicial ainda não implementada. Os componentes do design system
          estão disponíveis para inspeção em
          <code>/dev/design-system</code> durante o desenvolvimento.
        </p>
      }
    }
  </section>
</main>
