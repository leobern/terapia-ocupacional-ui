<main class="home">
  <header class="home__header">
    <div class="home__bell">
      <app-icon-button
        appearance="icon"
        icon="bell"
        [ariaLabel]="bellLabel()"
        (click)="openNotifications()"
      />
      @if (unreadCount() > 0) {
        <app-badge class="home__badge" type="numeral" [value]="unreadCount()" />
      }
    </div>
  </header>
  <h1 class="home__title">Conductia</h1>
  <app-home-header />
  <section class="home__content" [attr.data-state]="loadState()">
    @switch (loadState()) {
      @case ('loading') {}
      @case ('error') {}
      @default {
        <div class="home__hospital">
          <app-input-select
            variant="select"
            placeholder="Selecione o hospital"
            ariaLabel="Hospital"
            [value]="context.selected()?.name ?? ''"
            [expanded]="listOpen()"
            [controlsId]="listOpen() ? listId : null"
            (selectTrigger)="onTrigger()"
          />

          @if (listOpen()) {
            <ul
              class="home__hospital-list"
              role="listbox"
              aria-label="Hospitais vinculados"
              [id]="listId"
            >
              @for (
                hospital of context.hospitals;
                track hospital.id;
                let i = $index
              ) {
                <li
                  class="home__hospital-option"
                  role="option"
                  tabindex="0"
                  [attr.aria-selected]="hospital.id === context.selected()?.id"
                  (click)="choose(hospital.id)"
                  (keydown)="onOptionKeydown($event, i, hospital.id)"
                >
                  {{ hospital.name }}
                </li>
              }
            </ul>
          }
        </div>
      }
    }
  </section>
</main>
