<app-background-mesh
  [variant]="backgroundVariant()"
  [showColor3Desktop]="!isNotificationsRoute()"
/>

<div class="app-shell">
  @if (showShell()) {
    <app-nav-menu
      [activeItem]="activeNavItem()"
      [open]="menuOpen()"
      [disabledItems]="disabledNavItems"
      [actionsOpen]="aiAssistant.shortcutsOpen()"
      (closed)="menuOpen.set(false)"
      (logoClick)="aiAssistant.openPanel()"
      (homeClick)="onHomeClick()"
      (pacientesClick)="onPacientesClick()"
      (acoesTelaClick)="menuOpen.set(false); aiAssistant.openShortcuts()"
      (farmaciaClick)="onFarmaciaClick()"
      (notificacoesClick)="onNotificacoesClick()"
    />
  }
  <router-outlet />
  <!--
    DEPOIS do <router-outlet /> por dois motivos, ambos normativos:
    1. o seletor `router-outlet + *` (app.component.scss) dá `flex: 1 0 0` ao irmão
       imediatamente seguinte do outlet — que é o conteúdo da rota. Montada ANTES,
       a barra é que receberia o flex, quebrando o layout de desktop em silêncio;
    2. assim a ordem de tabulação (conteúdo → barra) bate com a leitura visual.
    A barra é `position: fixed`, então não é flex item e não disputa largura.
  -->
  @if (showShell()) {
    <app-bottom-nav-bar
      [menuOpen]="menuOpen()"
      [aiOpen]="aiAssistant.isOpen()"
      [actionsOpen]="aiAssistant.shortcutsOpen()"
      (menuClick)="menuOpen.set(true)"
      (aiClick)="aiAssistant.openPanel()"
      (actionsClick)="aiAssistant.openShortcuts()"
    />

    @if (!viewportBreakpoint.isDesktop()) {
      <app-bottom-sheet
        ariaLabel="Assistente de IA"
        [open]="aiAssistant.isOpen()"
        [showLogo]="!showAssistantHeading()"
        [snap]="aiSheetSnap()"
        [shortcuts]="shortcuts()"
        (closed)="aiAssistant.closePanel()"
        (snapChange)="aiSheetSnap.set($event)"
        (shortcutSelect)="onAiShortcut($event)"
      >
        <app-assistant-heading bottomSheetHeaderStart />
        <app-assistant-content bottomSheetContent />
        <!-- Cadastro aberto: sugestões da IA + mensagem/áudio no rodapé; o botão de envio fica no formulário. -->
        @if (aiAssistant.view() === 'form') {
          <app-assistant-form-footer bottomSheetFooter />
        } @else {
          <app-input-chat
            bottomSheetFooter
            placeholder="Escreva a sua mensagem"
            [(value)]="aiChatValue"
            [(mode)]="aiChatMode"
            (send)="onAiSend($event)"
            (audioSend)="onAiAudio($event)"
          />
        }
      </app-bottom-sheet>
    } @else {
      <app-drawer
        ariaLabel="Assistente de IA"
        [open]="aiAssistant.isOpen()"
        [showLogo]="!showAssistantHeading()"
        [snap]="aiDrawerSnap()"
        [shortcuts]="shortcuts()"
        (closed)="aiAssistant.closePanel()"
        (snapChange)="aiDrawerSnap.set($event)"
        (shortcutSelect)="onAiShortcut($event)"
      >
        <app-assistant-heading drawerHeaderStart />
        <app-assistant-content drawerContent />
        <!-- Cadastro aberto: o botão de envio ocupa o rodapé no lugar da mensagem/áudio. -->
        @if (aiAssistant.view() === 'form') {
          <app-assistant-form-footer drawerFooter />
        } @else {
          <app-input-chat
            drawerFooter
            placeholder="Escreva a sua mensagem"
            [(value)]="aiChatValue"
            [(mode)]="aiChatMode"
            (send)="onAiSend($event)"
            (audioSend)="onAiAudio($event)"
          />
        }
      </app-drawer>
    }
  }
</div>
