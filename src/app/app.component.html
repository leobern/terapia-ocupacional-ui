<app-background-mesh
  [color1]="backgroundColor1()"
  [showColor2]="backgroundShowColor2()"
/>

<div class="app-shell">
  @if (showShell()) {
    <app-nav-menu
      [open]="menuOpen()"
      (closed)="menuOpen.set(false)"
      (logoClick)="aiAssistant.openPanel()"
      (homeClick)="onHomeClick()"
      (acoesTelaClick)="menuOpen.set(false); aiAssistant.openShortcuts()"
      (notificacoesClick)="onNotificacoesClick()"
    />
  }
  <router-outlet />
  <!--
    DEPOIS do <router-outlet /> por dois motivos, ambos normativos:
    1. o seletor `router-outlet + *` (app.component.scss) dá `flex: 1 0 0` ao irmão
       imediatamente seguinte do outlet — que é o conteúdo da rota. Montada ANTES,
       a barra é que receberia o flex, quebrando o layout de desktop em silêncio;
    2. assim a ordem de tabulação (conteúdo → barra) bate com a leitura visual.
    A barra é `position: fixed`, então não é flex item e não disputa largura.
  -->
  @if (showShell()) {
    <app-bottom-nav-bar
      [menuOpen]="menuOpen()"
      [aiOpen]="aiAssistant.isOpen()"
      (menuClick)="menuOpen.set(true)"
      (aiClick)="aiAssistant.openPanel()"
      (actionsClick)="aiAssistant.openShortcuts()"
    />

    @if (!viewportBreakpoint.isDesktop()) {
      <app-bottom-sheet
        ariaLabel="Assistente de IA"
        [open]="aiAssistant.isOpen()"
        [snap]="aiSheetSnap()"
        [shortcuts]="shortcuts()"
        (closed)="aiAssistant.closePanel()"
        (snapChange)="aiSheetSnap.set($event)"
        (shortcutSelect)="onAiShortcut($event)"
      >
        <app-assistant-content bottomSheetContent />
        <app-input-chat
          bottomSheetFooter
          placeholder="Escreva a sua mensagem"
          (send)="onAiSend($event)"
        />
      </app-bottom-sheet>
    } @else {
      <app-drawer
        ariaLabel="Assistente de IA"
        [open]="aiAssistant.isOpen()"
        [snap]="aiDrawerSnap()"
        [shortcuts]="shortcuts()"
        (closed)="aiAssistant.closePanel()"
        (snapChange)="aiDrawerSnap.set($event)"
        (shortcutSelect)="onAiShortcut($event)"
      >
        <app-assistant-content drawerContent />
        <app-input-chat
          drawerFooter
          placeholder="Escreva a sua mensagem"
          (send)="onAiSend($event)"
        />
      </app-drawer>
    }
  }
</div>
