<div class="app-shell">
  @if (showShell()) {
    <app-nav-menu (logoutClick)="requestLogout()" />
  }
  <router-outlet />
  <!--
    DEPOIS do <router-outlet /> por dois motivos, ambos normativos:
    1. o seletor `router-outlet + *` (app.component.scss) dá `flex: 1 0 0` ao irmão
       imediatamente seguinte do outlet — que é o conteúdo da rota. Montada ANTES,
       a barra é que receberia o flex, quebrando o layout de desktop em silêncio;
    2. assim a ordem de tabulação (conteúdo → barra) bate com a leitura visual.
    A barra é `position: fixed`, então não é flex item e não disputa largura.
  -->
  @if (showShell()) {
    <app-bottom-nav-bar
      [menuOpen]="menuOpen()"
      (menuClick)="menuOpen.set(true)"
    />
  }
  @if (showShell()) {
    <app-bottom-sheet
      [open]="menuOpen()"
      [showLogo]="false"
      [ariaLabel]="i18n.t('logout.menuLabel')"
      (closed)="menuOpen.set(false)"
    >
      <div bottomSheetContent>
        <app-button
          kind="secondary"
          appearance="outlined"
          iconLeft="power"
          [fullWidth]="true"
          [label]="i18n.t('logout.signOut')"
          (click)="requestLogout()"
        />
      </div>
    </app-bottom-sheet>
    <app-logout-confirm
      [open]="confirmOpen()"
      [busy]="loggingOut()"
      (cancelled)="cancelLogout()"
      (confirmed)="confirmLogout()"
    />
  }
</div>
