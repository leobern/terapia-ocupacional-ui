<div class="section-header">
  <h2 class="section-header__title" [attr.id]="headingId()">{{ title() }}</h2>
  @if (actionIcon(); as icon) {
    <app-icon-button
      kind="primary"
      appearance="tonal"
      size="small"
      [icon]="icon"
      [ariaLabel]="actionLabel()"
      [disabled]="actionDisabled()"
      (click)="actionClick.emit()"
    />
  }
  <ng-content />
</div>
