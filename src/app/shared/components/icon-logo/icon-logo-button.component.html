<button
  type="button"
  class="icon-logo-button"
  [class.keyboard-focus]="keyboardFocused()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-expanded]="ariaExpanded()"
  [disabled]="disabled()"
  (blur)="onBlur()"
  (click)="onClick()"
  (focus)="onFocus()"
  (mouseenter)="hovered.set(true)"
  (mouseleave)="hovered.set(false)"
>
  <app-icon-logo-visual
    [state]="visualState()"
    [lightsVisible]="lightsVisible()"
  />
</button>
