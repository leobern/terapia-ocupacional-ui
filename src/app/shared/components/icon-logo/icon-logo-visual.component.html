<!--
  Ordem do DOM = ordem de composição. `multiply` e `color` compõem contra tudo que já foi
  pintado ABAIXO, então reordenar estas camadas muda o resultado visual (data-model.md §2).

  Nenhum wrapper envolve as luzes: um elemento com `transform`/`will-change` entre elas e as
  camadas irmãs criaria stacking context e isolaria o `mix-blend-mode`, transformando-as em
  manchas chapadas (research.md §1).
-->
<span class="icon-logo__symbol">
  <span class="icon-logo__base"></span>

  @if (state() !== 'disabled') {
    <span class="icon-logo__surface"></span>
  }

  @if (state() !== 'button') {
    <span class="icon-logo__halo"></span>
  }
