<div class="date-strip" role="group" aria-label="Datas">
  <button
    type="button"
    class="date-strip__arrow"
    aria-label="Dia anterior"
    (click)="shift(-1)"
  >
    <ph-icon name="caret-left" [size]="24" />
  </button>
  @for (day of days(); track day.kind + day.date.getTime()) {
    @if (day.kind === 'today') {
      <button
        type="button"
        class="date-strip__day date-strip__day--today"
        aria-label="Ir para hoje"
        (click)="pick(day)"
      >
        <span class="date-strip__weekday">Hoje</span>
        <ph-icon name="arrow-right" [size]="24" />
      </button>
    } @else {
      <button
        type="button"
        class="date-strip__day"
        [class.date-strip__day--selected]="day.selected"
        [class.date-strip__day--past]="day.selected && !isToday()"
        [attr.aria-label]="day.label"
        [attr.aria-pressed]="day.selected"
        (click)="pick(day)"
      >
        <span class="date-strip__weekday">{{ day.weekday }}</span>
        <span class="date-strip__number">{{ day.dayOfMonth }}</span>
      </button>
    }
  }
  <!-- Em "hoje" a seta da direita fica desabilitada (não há datas futuras), na cor de desabilitado do Figma. -->
  <button
    type="button"
    class="date-strip__arrow"
    aria-label="Próximo dia"
    [disabled]="!canGoForward()"
    (click)="shift(1)"
  >
    <ph-icon name="caret-right" [size]="24" />
  </button>
</div>
