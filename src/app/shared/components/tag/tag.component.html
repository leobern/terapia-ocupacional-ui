@switch (type()) {
  @case ('user') {
    <app-avatar size="small" type="photo" [imageUrl]="avatarSrc()" />
    <span class="tag__label">{{ label() }}</span>
    @if (iconRight()) {
      <ph-icon
        [name]="resolvedIconRightName()"
        [size]="16"
        [style.color]="iconRightColor()"
      />
    }
  }
  @case ('default') {
    @if (iconLeft()) {
      <ph-icon
        [name]="resolvedIconLeftName()"
        [size]="16"
        [style.color]="iconLeftColor()"
      />
    }
    <span class="tag__label tag__label--default">{{ label() }}</span>
    @if (iconRight()) {
      <ph-icon
        [name]="resolvedIconRightName()"
        [size]="16"
        [style.color]="iconRightColor()"
      />
    }
  }
  @case ('status') {
    <span class="tag__label tag__label--status">{{ label() }}</span>
  }
}
