<!--
  Figma "Conductia - V1" `v2/CardPatients`: card fixo em largura total, anel de
  metas (88px), título, subtítulo e legenda com os percentuais em texto.
  O card inteiro é área de toque; o teclado usa o <button> da seta.
-->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
<article
  class="card-patients"
  [class.card-patients--disabled]="ctaDisabled()"
  (click)="onCardClick()"
>
  <app-graph-meta
    size="large"
    [topPercentage]="averageCaloricPercentage()"
    [bottomPercentage]="averageProteinPercentage()"
    [centerLabel]="isZero() ? '✓' : '' + patientCount()"
    [ariaLabel]="
      'Aporte calórico ' +
      averageCaloricPercentage() +
      '%, aporte protéico ' +
      averageProteinPercentage() +
      '%'
    "
  />

  <div class="card-patients__label">
    <p class="card-patients__title">{{ title() }}</p>
    <p class="card-patients__subtitle">{{ subtitle() }}</p>
    <div class="card-patients__legend">
      <span class="card-patients__legend-item">
        <span class="card-patients__dot card-patients__dot--caloric"></span>
        Calórico {{ averageCaloricPercentage() }}%
      </span>
      <span class="card-patients__legend-item">
        <span class="card-patients__dot card-patients__dot--protein"></span>
        Protéico {{ averageProteinPercentage() }}%
      </span>
    </div>
  </div>

  <button
    type="button"
    class="card-patients__cta"
    [attr.aria-label]="actionAriaLabel()"
    [disabled]="ctaDisabled()"
  >
    <ph-icon name="caret-right" [size]="24" />
  </button>
</article>
