@if (!disabled() && hasStart()) {
  <button
    type="button"
    class="swipe-row__action swipe-row__action--start"
    [class.swipe-row__action--revealed]="startRevealed()"
    [attr.aria-label]="startActionAriaLabel()"
    (focus)="startFocused.set(true)"
    (blur)="startFocused.set(false)"
    (click)="startTriggered.emit()"
  >
    {{ startActionLabel() }}
  </button>
}
@if (!disabled()) {
  <button
    type="button"
    class="swipe-row__action"
    [class.swipe-row__action--revealed]="revealed()"
    [attr.aria-label]="actionAriaLabel()"
    (focus)="focused.set(true)"
    (blur)="focused.set(false)"
    (click)="triggered.emit()"
  >
    {{ actionLabel() }}
  </button>
}
<div
  class="swipe-row__content"
  [class.swipe-row__content--dragging]="dragging()"
  [style.transform]="'translateX(' + translate() + 'px)'"
  (pointerdown)="down($event)"
  (pointermove)="move($event)"
  (pointerup)="up()"
  (pointercancel)="up()"
>
  <ng-content />
</div>
