@if (open()) {
  <!-- Figma v2/Dialog Type=confirm: título, texto e duas ações md. Padrão dos modais (Thiago, 2026-11-23): ação
       primária à ESQUERDA da secundária, na mesma linha, alinhadas à direita, com 16px entre elas. -->
  <div class="confirm-dialog__scrim">
    <div
      class="confirm-dialog__panel"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
    >
      <p id="confirm-dialog-title" class="confirm-dialog__title">
        {{ title() }}
      </p>
      @if (message()) {
        <p class="confirm-dialog__message">{{ message() }}</p>
      }
      <div class="confirm-dialog__actions">
        <app-button
          kind="primary"
          appearance="solid"
          size="md"
          [label]="confirmLabel()"
          (click)="confirmed.emit()"
        />
        <app-button
          kind="primary"
          appearance="ghost"
          size="md"
          [label]="cancelLabel()"
          (click)="cancelled.emit()"
        />
      </div>
    </div>
  </div>
}
