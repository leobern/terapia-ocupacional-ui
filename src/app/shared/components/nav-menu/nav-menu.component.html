<!--
  `:host` reserva só o trilho colapsado (72px, nunca muda) — o painel abaixo é
  quem expande, `position: absolute`, flutuando POR CIMA do conteúdo da rota em
  vez de empurrá-lo (feedback do usuário: a versão anterior "arrastava" o
  conteúdo ao abrir).
-->
<!-- Mobile: fundo escurecido a 10% atrás do menu; tocar fora dele fecha (Thiago, 2026-11-25). -->
<div class="nav-menu__scrim" aria-hidden="true" (click)="onCloseClick()"></div>
<div
  class="nav-menu__panel"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
>
  <div class="nav-menu__logo">
    <!--
      Mesma instância em qualquer estado — nunca troca de componente nem de
      posição (feedback do usuário: a logo "pulava" de lugar ao abrir/fechar).
      `--icon-logo-size: 40px` e a cor (primary→secondary) via
      `--icon-logo-accent-override`, ambos definidos no SCSS — só o wordmark
      ao lado aparece/some, com o mesmo fade dos rótulos dos itens. Clicar
      abre o assistente de IA — mesmo destino do botão de IA da bottom-nav-bar.
    -->
    <span class="nav-menu__logo-slot">
      <app-icon-logo-button
        class="nav-menu__logo-badge"
        ariaLabel="Abrir assistente de IA"
        (clicked)="logoClick.emit()"
      />
    </span>
    <span class="nav-menu__wordmark">Conduct<em>ia</em></span>

    @if (showCloseButton()) {
      <!--
        Mesmo botão "X" do bottom-sheet (secundário, small). O `<span>` existe
        porque o host do `app-icon-button` é `display: contents` e não gera
        caixa: sem ele o `margin-left: auto` seria inerte e o X ficaria colado
        ao wordmark em vez de ir para a extremidade direita do painel.
      -->
      <span class="nav-menu__close">
        <app-icon-button
          kind="secondary"
          appearance="icon"
          size="small"
          icon="x"
          ariaLabel="Fechar menu"
          (click)="onCloseClick()"
        />
      </span>
    }
  </div>

  <nav class="nav-menu__links" aria-label="Navegação principal">
    @for (item of visibleItems(); track item.key) {
      <button
        type="button"
        class="nav-menu__link"
        [class.nav-menu__link--active]="activeItem() === item.key"
        [class.keyboard-focus]="keyboardFocused()"
        [disabled]="disabledItems().includes(item.key)"
        (click)="onItemClick(item.key)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      >
        <ph-icon
          class="nav-menu__icon"
          [weight]="activeItem() === item.key ? 'fill' : 'regular'"
          [name]="item.icon"
          [size]="24"
        />
        <span class="nav-menu__label">{{ item.label }}</span>
      </button>
    }
  </nav>

  <div class="nav-menu__theme" role="group" aria-label="Tema da interface">
    @for (theme of themes; track theme.value) {
      <button
        type="button"
        class="nav-menu__theme-button"
        [class.nav-menu__theme-button--active]="
          themeService.theme() === theme.value
        "
        [class.keyboard-focus]="keyboardFocused()"
        [attr.aria-pressed]="themeService.theme() === theme.value"
        [attr.aria-label]="theme.label"
        (click)="themeService.set(theme.value)"
        (focus)="onFocus()"
        (blur)="onBlur()"
      >
        <ph-icon
          [name]="theme.icon"
          [weight]="themeService.theme() === theme.value ? 'fill' : 'regular'"
          [size]="24"
        />
      </button>
    }
  </div>

  <div class="nav-menu__footer">
    <button
      type="button"
      class="nav-menu__profile"
      aria-label="Abrir o meu perfil"
      (click)="onProfileClick()"
    >
      <!-- Foto de perfil (ou iniciais): leva ao perfil do usuário, a mesma tela de detalhe da equipe. -->
      <app-user-avatar
        class="nav-menu__avatar"
        size="medium"
        [userId]="professionalId"
        [name]="professionalName"
      />
      <div class="nav-menu__profile-text">
        <span class="nav-menu__profile-name">{{ professionalName }}</span>
        <span class="nav-menu__profile-role">{{ professionalRole }}</span>
      </div>
    </button>

    <button
      type="button"
      class="nav-menu__link nav-menu__link--logout"
      [class.keyboard-focus]="keyboardFocused()"
      (click)="logoutClick.emit()"
      (focus)="onFocus()"
      (blur)="onBlur()"
    >
      <ph-icon class="nav-menu__icon" name="power" weight="bold" [size]="24" />
      <span class="nav-menu__label">Sair</span>
    </button>
  </div>
</div>
